name: Disrupt
description: >-
  Disrupt Technology Venture is a Bangkok, Thailand-based organization focused on
  building the country's startup ecosystem and developing future-ready business
  leaders through education, executive training, and venture investment. Its
  offerings include the House of Talents (HOT) executive leadership curriculum,
  the Advanced Executive Program (AXP), corporate in-house training, and the
  Disrupt MBA online course platform, alongside investment vehicles such as the
  Disrupt Health Impact Fund (deep-tech healthcare) and the Stormbreaker edtech
  startup accelerator. Disrupt reports 1,500+ program alumni, 20+ corporate
  clients (including KBank, PTT, Unilever, and Central Group), and that 7 of the
  top 10 Thai startups count Disrupt alumni among their founders. This profile was
  surfaced as a 500 Global portfolio company and added to the API Evangelist
  network. Disrupt publishes no public developer or API surface at this time.
